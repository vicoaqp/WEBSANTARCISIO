<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Alumnos por Grado/Sección</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #0d1117;
            color: #f0f6fc;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h1 {
            color: #c9d1d9;
            font-size: 28px;
            border-bottom: 2px solid #58a6ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .filtros {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
        }
        .filtro-grupo {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            max-width: 250px;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #8b949e;
        }
        select {
            padding: 10px;
            border: 1px solid #484f58;
            border-radius: 6px;
            font-size: 16px;
            background-color: #21262d; 
            color: #f0f6fc;
        }
        #search-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            background-color: #238636;
            color: white;
            cursor: pointer;
            font-weight: bold;
            height: 40px; 
            margin-top: 15px; 
        }
        #search-button:hover { background-color: #2ea043; }
        
        .resultados { margin-top: 20px; }
        .tarjeta-alumno {
            border: 1px solid #30363d;
            border-left: 6px solid #2ea043; /* Acento verde para alumno */
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            background-color: #1e2127;
        }
        .tarjeta-alumno h2 {
            color: #c9d1d9;
            margin-top: 0;
            font-size: 24px;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #30363d;
        }
        .tarjeta-alumno p {
            margin: 8px 0;
            color: #c9d1d9;
        }
        .tarjeta-alumno strong {
            color: #f0f6fc;
            font-weight: 700;
            min-width: 120px; /* Alineación */
            display: inline-block;
        }
        .edit-button {
            margin-top: 20px;
            background-color: #58a6ff;
            color: #0d1117;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .edit-button:hover { background-color: #79c0ff; }
        
        #mensajes p {
            padding: 15px; margin-top: 15px; border-radius: 8px; font-weight: 500;
            background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9;
        }
        #mensaje-cargando { color: #ffd700; }
        #mensaje-error {
            background-color: #6d0a1c; color: #ff7b72; border: 1px solid #a40e26;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧑‍🎓 Búsqueda de Alumnos</h1>

        <div class="filtros">
            <div class="filtro-grupo">
                <label for="grado-filtro">Grado</label>
                <select id="grado-filtro">
                    <option value="">Todos</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="filtro-grupo">
                <label for="seccion-filtro">Sección</label>
                <select id="seccion-filtro">
                    <option value="">Todos</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <button id="search-button" onclick="aplicarFiltrosAlumnos()">Buscar Alumnos</button>
        </div>

        <div id="mensajes">
            <p id="mensaje-cargando" style="display: none;">Cargando...</p>
            <p id="mensaje-error" style="display: none;"></p>
        </div>
        
        <div class="resultados" id="resultados-alumnos">
            </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOFAPB7LKSgJ0zYhiE5XANU8I0-68I08k",
            authDomain: "santarcisio2025.firebaseapp.com",
            projectId: "santarcisio2025",
            storageBucket: "santarcisio2025.firebasestorage.app",
            messagingSenderId: "785603745166",
            appId: "1:785603745166:web:b689ab60c7fd55968c80df",
            measurementId: "G-SHMGZLDNXB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        /**
         * Lógica principal para buscar y mostrar alumnos.
         */
        async function aplicarFiltrosAlumnos() {
            const grado = document.getElementById('grado-filtro').value;
            const seccion = document.getElementById('seccion-filtro').value;
            
            const resultadosDiv = document.getElementById('resultados-alumnos');
            const mensajeCargando = document.getElementById('mensaje-cargando');
            const mensajeError = document.getElementById('mensaje-error');

            resultadosDiv.innerHTML = '';
            mensajeError.style.display = 'none';
            mensajeCargando.style.display = 'block';

            if (!grado && !seccion) {
                mensajeCargando.style.display = 'none';
                resultadosDiv.innerHTML = '<p>Por favor, selecciona al menos un Grado o Sección.</p>';
                return;
            }

            try {
                let q = db.collection("students");

                if (grado) {
                    q = q.where("grado", "==", grado);
                }
                if (seccion) {
                    q = q.where("seccion", "==", seccion);
                }
                // Ordenar por apellido para una lista coherente
                q = q.orderBy("apellidos", "asc");

                const studentsSnapshot = await q.get();

                if (studentsSnapshot.empty) {
                    mensajeCargando.style.display = 'none';
                    resultadosDiv.innerHTML = '<p>No se encontraron alumnos en ese Grado/Sección.</p>'; 
                    return;
                }
                
                studentsSnapshot.forEach(doc => {
                    const studentData = doc.data();
                    // Pasamos el ID del Documento de Firestore, es más seguro para editar
                    const docId = doc.id; 
                    mostrarResultadoAlumno(studentData, docId);
                });

            } catch (error) {
                console.error("Error al buscar alumnos:", error);
                mensajeError.textContent = 'Hubo un error al cargar los datos. Revisa la consola (F12) o si faltan Índices Compuestos.';
                mensajeError.style.display = 'block';
            } finally {
                mensajeCargando.style.display = 'none';
            }
        }

        /**
         * Muestra una tarjeta individual por cada alumno encontrado.
         */
        function mostrarResultadoAlumno(student, docId) {
            const resultadosDiv = document.getElementById('resultados-alumnos');
            
            const tarjetaHTML = `
                <div class="tarjeta-alumno">
                    <h2>${student.nombres || ''} ${student.apellidos || ''}</h2>
                    <p><strong>ID Estudiante:</strong> ${student.idEstudiante || 'N/A'}</p>
                    <p><strong>Grado/Sección:</strong> ${student.grado || 'N/A'}° ${student.seccion || 'N/A'}</p>
                    <p><strong>Celular:</strong> ${student.celular || 'No registrado'}</p>
                    <p><strong>Dirección:</strong> ${student.direccion || 'No registrada'}</p>
                    <p><strong>DNI Padre:</strong> ${student.dnipapa || 'No registrado'}</p>
                    
                    <button class="edit-button" onclick="editarAlumno('${docId}')">Editar Datos</button>
                </div>
            `;
            resultadosDiv.innerHTML += tarjetaHTML;
        }

        /**
         * Redirige a la nueva página de edición, pasando el ID del documento.
         */
        function editarAlumno(docId) {
            // Redirigimos a la nueva página que crearemos
            window.location.href = `editar_alumno.html?id=${docId}`;
        }
    </script>

</body>
</html>
